# 1. API GATEWAY & STATIC FILE UPLOADS
server {
    listen 80;
    server_name event-api.porulontech.com;

    # Media uploads (proxied to marketplace service on port 8002)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8002/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # API Routes proxy to Gateway (port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# 2. UNIFIED PORTAL (CUSTOMER + VENDOR ON EVENT.PORULONTECH.COM)
server {
    listen 80;
    server_name event.porulontech.com;

    # Customer portal mounted under /customer
    location = /customer {
        return 301 /customer/;
    }

    location ^~ /customer/ {
        alias /var/www/magizhnaazh/apps/customer-web/dist/;
        index index.html;
        try_files $uri $uri/ /customer/index.html;

        location ~* /customer/assets/.*\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /customer/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }
    }

    # Vendor portal mounted under /vendor
    location = /vendor {
        return 301 /vendor/;
    }

    location ^~ /vendor/ {
        alias /var/www/magizhnaazh/apps/vendor-web/dist/;
        index index.html;
        try_files $uri $uri/ /vendor/index.html;

        location ~* /vendor/assets/.*\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /vendor/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }
    }

    # Admin portal mounted under /admin
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /var/www/magizhnaazh/apps/admin-web/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        location ~* /admin/assets/.*\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /admin/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }
    }

    # Redirect root to customer portal
    location = / {
        return 301 /customer/;
    }

    # Redirect root /invite/ links to /customer/invite/
    location ^~ /invite/ {
        return 301 /customer$request_uri;
    }

    # API gateway (proxied to Gateway service on port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Uploaded media files
    location /uploads/ {
        alias /var/www/magizhnaazh/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
}

# 3. LEGACY CUSTOMER DOMAIN REDIRECT
server {
    listen 80;
    server_name event-customer.porulontech.com;
    return 301 https://event.porulontech.com/customer$request_uri;
}

# 4. LEGACY VENDOR DOMAIN REDIRECT
server {
    listen 80;
    server_name event-vendor.porulontech.com;
    return 301 https://event.porulontech.com/vendor$request_uri;
}

# 5. LEGACY ADMIN DOMAIN REDIRECT
server {
    listen 80;
    server_name event-admin.porulontech.com;
    return 301 https://event.porulontech.com/admin$request_uri;
}
