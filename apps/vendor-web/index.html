<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="deploy-check" content="1788590621" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Lock the viewport: maximum-scale + user-scalable=no stops the mobile
         WebView from auto-zooming (the "screen moving" when tapping inputs) and
         from pinch-zoom panning; the screen stays fixed, only the form scrolls. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Declare the app as dark-schemed so Android WebView does NOT apply its
         algorithmic "force dark" inversion, which otherwise darkens our already
         light-on-dark text (tabs, labels) toward black and makes it unreadable. -->
    <meta name="color-scheme" content="dark" />
    <title>Magizhnaazh — Vendor Business Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
