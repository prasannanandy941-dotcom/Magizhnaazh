# Magizhnaazh — nginx site: 3 frontends + API proxy + uploaded files.
# Everything here is matched by server_name, so it coexists with any OTHER
# site on this server (their domains keep working, yours route only to you).
# Copied to /etc/nginx/sites-available/magizhnaazh.conf by deploy/server-setup.sh.

# 1) API gateway (proxied to the local gateway service) + uploaded media.
server {
    listen 80;
    server_name event-api.porulontech.com;

    client_max_body_size 60m;

    # Portfolio / menu images & videos, served straight from disk.
    location /uploads/ {
        alias /var/www/magizhnaazh/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# 2) Unified Portal on event.porulontech.com (Customer + Vendor)
server {
    listen 80;
    server_name event.porulontech.com;

    # Customer portal mounted under /customer
    location = /customer {
        return 301 /customer/;
    }

    location ^~ /customer/ {
        alias /var/www/magizhnaazh/apps/customer-web/dist/;
        index index.html;
        try_files $uri $uri/ /customer/index.html;

        location ~* /customer/assets/.*\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /customer/index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }
    }

    # Vendor portal mounted under /vendor
    location = /vendor {
        return 301 /vendor/;
    }

    location ^~ /vendor/ {
        alias /var/www/magizhnaazh/apps/vendor-web/dist/;
        index index.html;
        try_files $uri $uri/ /vendor/index.html;

        location ~* /vendor/assets/.*\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /vendor/index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }
    }

    # Admin portal mounted under /admin
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /var/www/magizhnaazh/apps/admin-web/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        location ~* /admin/assets/.*\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /admin/index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }
    }

    # Redirect root to customer portal
    location = / {
        return 301 /customer/;
    }

    # Redirect root company/support pages to customer portal
    location ~* ^/(about|careers|blog|press|help|returns|privacy|terms)\.html$ {
        return 301 /customer$request_uri;
    }

    # Redirect root /invite/ links to /customer/invite/
    location ^~ /invite/ {
        return 301 /customer$request_uri;
    }
}

# 3) Legacy customer domain redirect (event-customer -> event.porulontech.com/customer)
server {
    listen 80;
    server_name event-customer.porulontech.com;
    return 301 https://event.porulontech.com/customer$request_uri;
}

# 4) Legacy vendor domain redirect (event-vendor -> event.porulontech.com/vendor)
server {
    listen 80;
    server_name event-vendor.porulontech.com;
    return 301 https://event.porulontech.com/vendor$request_uri;
}

# 5) Legacy admin domain redirect (event-admin -> event.porulontech.com/admin)
server {
    listen 80;
    server_name event-admin.porulontech.com;
    return 301 https://event.porulontech.com/admin$request_uri;
}
