# Magizhnaazh — nginx site: 3 frontends + API proxy + uploaded files.
# Everything here is matched by server_name, so it coexists with any OTHER
# site on this server (their domains keep working, yours route only to you).
# Copied to /etc/nginx/sites-available/magizhnaazh.conf by deploy/server-setup.sh.

# 1) API gateway (proxied to the local gateway service) + uploaded media.
server {
    listen 80;
    server_name event-api.porulontech.com;

    client_max_body_size 60m;

    # Portfolio / menu images & videos, served straight from disk.
    location /uploads/ {
        alias /var/www/magizhnaazh/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# 2) Customer web (static SPA).
server {
    listen 80;
    server_name event-customer.porulontech.com;
    root /var/www/magizhnaazh/apps/customer-web/dist;
    index index.html;
    location = /index.html { add_header Cache-Control "no-store, must-revalidate"; }
    location / { try_files $uri $uri/ /index.html; }
}

# 3) Vendor web (static SPA).
server {
    listen 80;
    server_name event-vendor.porulontech.com;
    root /var/www/magizhnaazh/apps/vendor-web/dist;
