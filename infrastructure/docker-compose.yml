version: '3.8'

# For local development, only the datastore runs in Docker. Node services run
# via `npm run dev:*` against this Mongo instance (see root package.json) —
# containerizing the Node services themselves is future work, tracked
# separately, since it needs real Dockerfiles this repo doesn't have yet.
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Optional lightweight admin UI for the Mongo instance above.
  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb

volumes:
  mongo_data:
