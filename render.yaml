# Render Blueprint for the Magizhnaazh monorepo.
# Deploys 7 backend Node services + the customer-web frontend.
# The MongoDB database is NOT here — Render has no managed MongoDB. Create a
# free MongoDB Atlas cluster and put its connection string into MONGODB_URI in
# the "magizh-secrets" env group.
#
# All region = singapore. All plan = free.
# Free web services sleep after ~15 min idle and take ~30-60s to wake, so the
# services talk to each other over their PUBLIC https URLs (not the private
# network, which can't wake a sleeping instance). Those URLs are filled in once
# in the env group after the services exist — see the "*_SERVICE_URL" keys.

# ---------------------------------------------------------------------------
# Shared config, linked into every service via `fromGroup`.
#
# After the first deploy, open this group in the Render dashboard and paste:
#   - MONGODB_URI            -> your Atlas connection string  (already done)
#   - each *_SERVICE_URL     -> that service's https://...onrender.com URL
#   - VITE_GATEWAY_URL       -> the gateway's https://...onrender.com URL
# JWT_SECRET / INTERNAL_API_SECRET are auto-generated once and shared.
# ---------------------------------------------------------------------------
envVarGroups:
  - name: magizh-secrets
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: INTERNAL_API_SECRET
        generateValue: true
      # Public URLs of the services, filled in once after they're created.
      - key: AUTH_SERVICE_URL
        sync: false
      - key: MARKETPLACE_SERVICE_URL
        sync: false
      - key: EVENT_BUDGET_SERVICE_URL
        sync: false
      - key: BOOKING_PAYMENT_SERVICE_URL
        sync: false
      - key: INVITATION_SERVICE_URL
        sync: false
      - key: GUEST_FEEDBACK_SERVICE_URL
        sync: false
      # Baked into the frontend at build time; = the gateway's public URL.
      - key: VITE_GATEWAY_URL
        sync: false

services:
  # -------------------------------------------------------------------------
  # BACKEND — Node microservices (run with tsx, no build step)
  # -------------------------------------------------------------------------
  - type: web
    name: magizh-auth
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npx tsx services/auth-service/index.ts
    healthCheckPath: /health
    envVars:
      - fromGroup: magizh-secrets

  - type: web
    name: magizh-marketplace
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npx tsx services/marketplace-service/index.ts
    healthCheckPath: /health
    envVars:
      - fromGroup: magizh-secrets

  - type: web
    name: magizh-event-budget
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npx tsx services/event-budget-service/index.ts
    healthCheckPath: /health
    envVars:
      - fromGroup: magizh-secrets

  - type: web
    name: magizh-booking-payment
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npx tsx services/booking-payment-service/index.ts
    healthCheckPath: /health
    envVars:
      - fromGroup: magizh-secrets

  - type: web
    name: magizh-invitation
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npx tsx services/invitation-service/index.ts
    healthCheckPath: /health
    envVars:
      - fromGroup: magizh-secrets

  - type: web
    name: magizh-guest-feedback
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npx tsx services/guest-feedback-service/index.ts
    healthCheckPath: /health
    envVars:
      - fromGroup: magizh-secrets

  # -------------------------------------------------------------------------
  # GATEWAY — public API entrypoint; the frontend only talks to this.
  # -------------------------------------------------------------------------
  - type: web
    name: magizh-gateway
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npx tsx services/gateway/index.ts
    healthCheckPath: /health
    envVars:
      - fromGroup: magizh-secrets

  # -------------------------------------------------------------------------
  # FRONTEND — customer-web (Vite static build). VITE_GATEWAY_URL is baked in
  # at build time from the env group.
  # -------------------------------------------------------------------------
  - type: web
    name: magizh-customer-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build --prefix apps/customer-web
    staticPublishPath: apps/customer-web/dist
    envVars:
      - fromGroup: magizh-secrets
    routes:
      # SPA fallback so client-side routes resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
